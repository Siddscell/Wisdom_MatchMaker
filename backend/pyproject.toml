[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-client-matchmaking"
version = "0.1.0"
description = "AI supplier-client matching platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.31",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.18",
  "pgvector>=0.2.4",
  "fastembed>=0.3.0",
  "httpx>=0.27.0",
  "email-validator>=2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.2", "ruff>=0.5.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: loads the real embedding model (run with: pytest -m slow)",
  "db: needs TEST_DATABASE_URL pointing at an empty Postgres with pgvector",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/seed/seed_data.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
